name: Build Kalisi (Native Flutter)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android platform files
        run: |
          flutter create --org app --project-name kalisi --platforms=android .
          GRADLE=android/app/build.gradle.kts
          if [ -f "$GRADLE" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' "$GRADLE" || true
            # pin NDK if an ndkVersion line exists, else inject one under android {
            if grep -q "ndkVersion" "$GRADLE"; then
              sed -i 's/ndkVersion = .*/ndkVersion = "26.3.11579264"/' "$GRADLE"
            else
              sed -i 's/    compileSdk = flutter.compileSdkVersion/    compileSdk = flutter.compileSdkVersion\n    ndkVersion = "26.3.11579264"/' "$GRADLE"
            fi
          else
            GRADLE=android/app/build.gradle
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' "$GRADLE" || true
            sed -i 's/minSdk flutter.minSdkVersion/minSdk 23/' "$GRADLE" || true
          fi
          echo "--- gradle config ---"; cat "$GRADLE" | grep -nE "minSdk|compileSdk|ndkVersion|targetSdk" || true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Drift database code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build debug APK
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build.log

      - name: Show build errors on failure
        if: failure()
        run: tail -120 build.log 2>/dev/null || true

      - name: Verify APK exists
        run: |
          echo "--- looking for APK ---"
          find build -name "*.apk" -type f 2>/dev/null || echo "NO APK FOUND"
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "flutter-apk dir missing"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kalisi-native-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
