name: Build Kalisi (Native Flutter)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.29.0'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android platform files
        run: |
          flutter create --org app --project-name kalisi --platforms=android .
          GRADLE=android/app/build.gradle.kts
          if [ -f "$GRADLE" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' "$GRADLE" || true
            # Firebase needs compileSdk 35
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' "$GRADLE" || true
            sed -i 's/compileSdk = [0-9]\+/compileSdk = 35/' "$GRADLE" || true
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/' "$GRADLE" || true
            # Force the applicationId + namespace to com.messenger.app (Firebase package)
            sed -i 's/applicationId = "[^"]*"/applicationId = "com.messenger.app"/' "$GRADLE" || true
            sed -i 's/namespace = "[^"]*"/namespace = "com.messenger.app"/' "$GRADLE" || true
          else
            GRADLE=android/app/build.gradle
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' "$GRADLE" || true
            sed -i 's/minSdk flutter.minSdkVersion/minSdk 23/' "$GRADLE" || true
            sed -i 's/applicationId "[^"]*"/applicationId "com.messenger.app"/' "$GRADLE" || true
          fi
          echo "--- app gradle ---"; grep -nE "minSdk|compileSdk|ndkVersion|applicationId|namespace" "$GRADLE" || true
          echo "--- settings ---"; grep -iE "kotlin|android.application" android/settings.gradle.kts 2>/dev/null || true
          # Add camera + microphone + internet + notification permissions
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ] && ! grep -q "RECORD_AUDIO" "$MANIFEST"; then
            sed -i 's#<manifest\(.*\)>#<manifest\1>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>#' "$MANIFEST"
          fi
          echo "--- manifest perms ---"; grep -E "uses-permission" "$MANIFEST" || true
          # Set the visible app name to "Kalisi"
          sed -i 's/android:label="kalisi"/android:label="Kalisi"/' "$MANIFEST" || true
          # Enable core library desugaring + google-services plugin
          python3 ci/enable_desugaring.py
          # Firebase config (committed at ci/google-services.json)
          if [ -f ci/google-services.json ]; then
            cp ci/google-services.json android/app/google-services.json
            echo "google-services.json installed"
          fi

      - name: Wire Firebase (push notifications)
        run: |
          cp ci/google-services.json android/app/google-services.json
          echo "google-services.json placed."
          python3 ci/wire_firebase.py
          echo "--- app plugins ---"; grep -nA6 "plugins {" android/app/build.gradle.kts | head -20 || true
          echo "--- settings plugins ---"; grep -n "google-services" android/settings.gradle.kts || true

      - name: Set up signing (if keystore secret is present)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Keystore secret found — configuring release signing."
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/kalisi-release.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=kalisi-release.jks\n' \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
            python3 ci/wire_signing.py android/app/build.gradle.kts
            echo "Release signing configured."
          else
            echo "No keystore secret — release build will be unsigned (testing only)."
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons || echo "icon generation skipped"

      - name: Generate Drift database code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Run tests (crypto round-trip, etc.)
        run: |
          set -o pipefail
          rm -f test/widget_test.dart
          if ! flutter test 2>&1 | tee test.log; then
            echo "TESTS FAILED:"
            grep -iE "error|exception|expected|actual|unimplemented|failed" test.log | tail -25 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

      - name: Build debug APK
        run: |
          set -o pipefail
          if ! flutter build apk --debug 2>&1 | tee build.log; then
            echo "BUILD FAILED — extracting error lines:"
            grep -iE "error:|e: |exception|FAILURE:|What went wrong|Could not|A problem occurred|Execution failed|> Task .* FAILED|minCompileSdk|AAR metadata|compileSdk|dependency requires|is not compatible" build.log | tail -25 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            # also emit the 20 lines following "What went wrong" for the real cause
            awk '/What went wrong/{f=1} f{print; n++} n>20{exit}' build.log | while IFS= read -r line; do
              echo "::error::CAUSE ${line}"
            done
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Show build errors on failure
        if: failure()
        run: tail -120 build.log 2>/dev/null || true

      - name: Verify APK exists
        run: |
          echo "--- looking for APK ---"
          find build -name "*.apk" -type f 2>/dev/null || echo "NO APK FOUND"
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "flutter-apk dir missing"

      - name: Build release APK + AAB (small, Play Store)
        run: |
          set -o pipefail
          echo "=== Release APKs split per architecture (smallest — ~10-12 MB each) ==="
          flutter build apk --release --split-per-abi 2>&1 | tee -a build.log || true
          echo "=== Also a universal release APK (works on any phone) ==="
          flutter build apk --release 2>&1 | tee -a build.log || true
          echo "=== Release AAB (for Play Store upload) ==="
          flutter build appbundle --release 2>&1 | tee -a build.log || true
          echo "--- release outputs + sizes ---"
          ls -lh build/app/outputs/flutter-apk/*.apk 2>/dev/null || true
          ls -lh build/app/outputs/bundle/release/*.aab 2>/dev/null || true

      - name: Upload small release APK (arm64 — most phones)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kalisi-small-apk-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: warn

      - name: Upload universal release APK (any phone)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kalisi-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn

      - name: Upload release AAB (Play Store)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kalisi-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
