name: Build Kalisi (Native Flutter)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android platform files
        run: |
          flutter create --org app --project-name kalisi --platforms=android .
          # Firebase + mobile_scanner need minSdk 23; bump it in the generated gradle.
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle 2>/dev/null || true
          sed -i 's/minSdk flutter.minSdkVersion/minSdk 23/' android/app/build.gradle 2>/dev/null || true
          echo "--- android/app gradle (min sdk) ---"
          (grep -n "minSdk" android/app/build.gradle.kts 2>/dev/null || grep -n "minSdk" android/app/build.gradle 2>/dev/null) || true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Drift database code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify APK exists
        run: |
          echo "--- looking for APK ---"
          find build -name "*.apk" -type f 2>/dev/null || echo "NO APK FOUND"
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "flutter-apk dir missing"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kalisi-native-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
