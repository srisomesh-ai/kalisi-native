name: kalisi
description: Kalisi — Private messenger. No phone number.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: ^2.5.1
  # Local database (SQLite)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  file_picker: ^8.1.2
  open_filex: ^4.5.0
  share_plus: ^10.0.2
  path: ^1.9.0
  # Crypto (pure-Dart ECDH P-256 / AES-GCM / SHA-256)
  pointycastle: ^3.9.1
  # Networking
  dio: ^5.4.3
  # QR (for Connect screen)
  qr_flutter: ^4.1.0
  # Calling
  flutter_webrtc: ^0.12.5
  # Plays the device's own ringtone / notification sounds (no bundled files)
  flutter_ringtone_player: ^4.0.0+4

  # Media
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  video_player: ^2.9.2
  video_compress: ^3.1.3
  flutter_image_compress: ^2.3.0
  audioplayers: ^6.0.0
  record: ^6.1.1
  # Emoji keyboard
  emoji_picker_flutter: ^4.3.0

  # Push notifications (Firebase)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "ci/icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#0E5C5C"
  adaptive_icon_foreground: "ci/icon_fg.png"

flutter:
  uses-material-design: true
  assets:
    - ci/icon.png
    - ci/icon_fg.png
