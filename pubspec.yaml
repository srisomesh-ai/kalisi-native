name: kalisi
description: Kalisi — Private messenger. No phone number.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: ^2.5.1
  # Local database (SQLite)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  # Crypto (ECDH P-256, AES-GCM, SHA-256)
  cryptography: ^2.7.0
  # Native platform crypto (Android/iOS) so ECDH P-256 works on-device
  cryptography_flutter: ^2.3.2
  # Networking
  dio: ^5.4.3
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
